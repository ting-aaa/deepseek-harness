# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

# This text-only scenario does not exercise either platform shell consumer.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

# Serialize independent children so recorded roles remain stable.
- id: optional-harness2
  config:
    provider: spawn
    maxConcurrentChildren: 1
    childTimeoutMs: 30000
    maxStepsPerChild: 4
    maxTokensPerChild: 4096

# This text-only scenario keeps the directory service but omits its unrelated prose.
- insert:
    - id: harness2-preview-runtime-context
      name: './runtime-context.ts'
