# Keyless TypeScript SDK replay patch over the live profile patch.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: llm-deepseek-account
  disabled: true

# SDK initialize must remain unavailable when the recorded adapter cannot activate.
- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, sdkSnapshotReplayReady]

- insert:
    - id: llm-replay
      name: '../replay-ready.ts'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
